name: confirmation-diff-base
# AWI-PROVIDER-CONTEXTDEV-001 AC24e/AC24h, R15: judge every PR with the BASE branch's confirmation_diff.py and gates.py,
# so a PR's own copies of the checker, gates.py or this workflow never judge that PR.
# pull_request_target runs this file as it is on the base branch. It NEVER executes PR code: only the base is checked out,
# and the PR head is fetched as git data (diff and `git show` of the two yaml files).
# Still open: a branch ruleset must make this check required (Fred); see the cycle's decisions.md.
# SQ2 (R16): once this exists on the base, the base checker rejects any change to gates.py, confirmation_diff.py or the
# confirmation workflows; such a change needs a separate Fred or CEO ruling.
on:
  pull_request_target: {}
permissions: {contents: read}
jobs:
  confirmation-diff-base-judged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.base.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: fetch the PR head as data (never checked out)
        env: {PR_NUMBER: "${{ github.event.pull_request.number }}"}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/awi/pr-head"
      - name: base-judged confirmation_diff
        env:
          AWI_BASE_REF: "${{ github.event.pull_request.base.sha }}"
          AWI_HEAD_REF: refs/awi/pr-head
        run: |
          # >>> base-judge
          set -euo pipefail
          base="$AWI_BASE_REF"; head="$AWI_HEAD_REF"
          if ! git cat-file -e "$base:bench/awibench/confirmation_diff.py" 2>/dev/null; then
            # SQ1 (R16): fail closed. The only exemption is the bootstrap PR, detected structurally: the checker is absent at the
            # base and ADDED by this PR (never by PR number).
            mb="$(git merge-base "$base" "$head")"
            if git diff --name-status --no-renames "$mb" "$head" -- bench/awibench/confirmation_diff.py | grep -q '^A'; then
              echo "BOOTSTRAP: this PR adds confirmation_diff.py to a base without one; no base checker exists to judge it"; exit 0
            fi
            echo "FAILED: the base has no confirmation_diff.py and this PR does not add it (SQ1: fail closed)"; exit 1
          fi
          judge="$(mktemp -d)"; trap 'rm -rf "$judge"' EXIT
          mkdir -p "$judge/awibench"; : > "$judge/awibench/__init__.py"
          for f in confirmation_diff.py gates.py; do git show "$base:bench/awibench/$f" > "$judge/awibench/$f"; done
          flag="$(cd "$judge" && python3 -c 'from awibench.gates import REQUIRED_FLAG; print(REQUIRED_FLAG)')"
          echo "judging $head with the base checker; flag name from base gates.py: $flag"
          cd "$judge" && AWI_REPO_ROOT="$OLDPWD" python3 -m awibench.confirmation_diff "$base" "$head"
          # <<< base-judge
