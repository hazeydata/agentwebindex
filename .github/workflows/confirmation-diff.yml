name: confirmation-diff
# AWI-PROVIDER-CONTEXTDEV-001 AC24e: ADVISORY self-test. It runs the PR's OWN confirmation_diff.py, which the PR can edit, so it is not
# the gate. The authoritative check is confirmation-diff-base.yml (base-judged, R15).
on:
  pull_request: {}
permissions: {contents: read}
jobs:
  confirmation-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: advisory self-test - PR's own confirmation_diff (authoritative check is confirmation-diff-base)
        working-directory: bench
        env:   # R21 (3): base and head SHAs from the event, not branch names
          AWI_BASE_REF: "${{ github.event.pull_request.base.sha }}"
          AWI_HEAD_REF: "${{ github.event.pull_request.head.sha }}"
        run: python -m awibench.confirmation_diff "$AWI_BASE_REF" "$AWI_HEAD_REF"
