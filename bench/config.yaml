   "max_full_runs_per_month": 5,
   "note": "Spec R44 (awi-provider-contextdev-001): Apify is not in the daily smoke run (R44.1); in the weekly full run Apify searches only the first 9 items of each search set (evergreen and the week's news set) so one full run projects <= $0.90 (R44.2): 18 searches x $0.0408 + up to 70 browser fetches x $0.00155 <= $0.843. Owner calls (Lucille 2, AWI owner, 2026-10-27 5:33 AM ET; recorded earlier as 5:34): (2) Apify is in no re-probe either (reprobe_exclude), so the weekly full runs get the whole Apify budget; a fifth full in a five-Monday month is dropped by the R44.3 per-provider fallback if it does not fit. (3) The quota-limited providers (tavily, firecrawl, browserless) are always kept for the weekly full runs: their full sizes fit max_full_runs_per_month (5) runs in the monthly quota at worst-case units with a 50-row news week (tavily 45+45 searches x 2 = 180; firecrawl 40+40 x 2 = 160; browserless 50 scrape rows x 2 + 20 tasks (52) + 20 news fetches x 1 = 172 units; full_reserve_units), and every daily smoke or re-probe run leaves full_reserve_units x the full runs still to come this month (full_cron_utc, the benchmark.yml full cron `23 11 * * 1`) unspent, so smoke and re-probes drop them first (skipped_reserve, spec R45.4). Their smoke runs are 1 item per set (smoke_limits). Trimmed rows note the reduced sample. Owner call (Lucille 2, 2026-10-27 6:20 AM ET): the full run stays on Monday (`23 11 * * 1`; 'Saturdays' was a wording slip). Exa is resized so every full run fits its 1,428-unit quota, the worst-case 50-row week included: its smoke runs shrink first, to 1 item per search set (2 calls instead of 31), and it gets a full_reserve_units entry of 150 (one untrimmed full at worst case: 100 evergreen + 50 news searches x 1 unit; 5 x 150 = 750 <= 1,428), so smoke and re-probes drop exa before they eat into the fulls. The per-full-run rows are not trimmed (not needed)."},
 "shared_quota": {"firecrawl": {"floor_credits": 10000, "meter": "https://api.firecrawl.dev/v2/team/credit-usage data.remainingCredits",
   "worst_case_units_per_call": {"search": 2},
   "worst_case_note": "Owner call (Lucille 2, 2026-10-27 6:31 AM ET): AWI never makes a firecrawl call whose worst-case units could take the shared balance below floor_credits, so AWI's own calls keep the shared balance well above zero and above Firecrawl's documented default auto-recharge threshold of 1,000 credits (auto_recharge_threshold_default). Not verified: the account's actual auto-recharge mode and threshold. collectors/benchmark.py _firecrawl_search sends limit 10 and no scrapeOptions, and search costs 2 credits per 10 results (bench/pricing.yaml credits_per_call), so one call costs at most 2 credits. The pre-run check uses the run's planned calls x worst case; the per-call check uses the next call's worst case; a kind with no entry here fails closed. AWI does not call firecrawl scrape.",
   "period_note": "Firecrawl's quota period runs from the 22nd to the 21st (billing period reset observed on the account meter 2026-10-22 9:15 AM ET; plan facts in bench/pricing.yaml firecrawl account_plan). AWI's own firecrawl ledger (1,000 units, data/spend/<YYYY-MM>-quota.json) and full_reserve stay on the calendar month on purpose: the floor guarantee never uses that ledger, they read the live shared balance (remainingCredits) before the run and before every call, which already reflects Firecrawl's 22nd-to-21st period. The calendar ledger only bounds AWI's own share: at most 1,000 units per calendar month, so at most 2,000 units (2% of 100,000) in one Firecrawl period that spans two calendar months.",
   "policy": "Owner call 3 (Lucille 2, 2026-10-27 5:33 AM ET; recorded earlier as 5:34): the Firecrawl key is shared with Fred's other tools, so AWI must not drain that balance. Before each run the pre-run check caps firecrawl's remaining units at the shared meter's remainingCredits minus floor_credits, and before every firecrawl call the runner re-reads the meter and stops firecrawl (run status stale_quota plus a skipped_floor row) if the call would take the shared balance below floor_credits. An unreadable meter drops firecrawl pre-run (skipped_balance_unknown) or stops it mid-run (stale_quota plus a skipped_balance_unknown row; fail closed). AWI's own monthly use stays capped by the free-tier ledger (1,000 units). Owner call (Lucille 2, 2026-10-27 6:20 AM ET): AWI skips firecrawl whenever the shared balance is below floor_credits (or the run's planned units, or the next call, would take it below), and signals firecrawl_floor_reached: a job-log line and a field in the job summary. Owner call (Lucille 2, 2026-10-27 6:31 AM ET): both checks use worst-case units (worst_case_units_per_call), so no AWI call can take the balance below the floor (10,000, above Firecrawl's documented default auto-recharge threshold of 1,000); an unreadable balance skips firecrawl (skipped_balance_unknown, spec R45.3).",
   "auto_recharge_threshold_default": 1000,
   "auto_recharge_note": "Firecrawl's open-source billing code (https://github.com/firecrawl/firecrawl/blob/6a5965a0/apps/api/src/services/billing/credit_billing.ts, lines 144-145 and 176-177): legacy auto-recharge fires when remaining_credits < auto_recharge_threshold (a team setting, default 1000), not only at zero. Public docs: https://docs.firecrawl.dev/billing (pay-as-you-go adds credits when the balance reaches zero; 'Starting June 1, 2026, Smart Upgrade replaces Auto-Recharge') and https://www.firecrawl.dev/pricing. runner.check_run fails closed (exit 2) unless floor_credits > auto_recharge_threshold_default. The account's actual auto-recharge mode and threshold are unverified; a team threshold above floor_credits would still allow a recharge. AWI never triggers, enables or changes any auto-recharge and calls no recharge or top-up endpoint (spec R45.2).",
   "floor_note": "floor_credits 10,000 set by the AWI owner (Lucille 2, 2026-10-27 6:20 AM ET); basis: about 10% of the 100K plan. Plan (owner call 2026-10-27 6:31 AM ET): Firecrawl Standard, 100,000 credits a month, $99, period resets on the 22nd, auto-recharge on at $5 per 2,000 credits with a $50 monthly cap; source: Fred via chief Oct 23, relayed by Lucille 2 (agent-relayed; Fred's own words not yet verified); see bench/pricing.yaml firecrawl account_plan. This resolves the earlier conflict with the 1,000-credit Free plan (pricing.yaml free_tier is the public Free plan and AWI's own 1,000-unit ledger, not the account's plan). Replaces the implementer's placeholder of 200."}},
